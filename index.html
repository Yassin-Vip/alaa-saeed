function splitIntoChunks(text, size = 3000){
  const clean = String(text || '').replace(/\r\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
  if(clean.length <= size) return [clean];
  const chunks = []; let current = '';
  const paragraphs = clean.split(/\n\n+/);
  for(const p of paragraphs){
    if((current + '\n\n' + p).length > size && current.length > 0){ chunks.push(current.trim()); current = p; }
    else { current += (current ? '\n\n' : '') + p; }
  }
  if(current.trim()) chunks.push(current.trim());
  const finalChunks = [];
  for(const c of chunks){
    if(c.length <= size * 1.5){ finalChunks.push(c); continue; }
    for(let i = 0; i < c.length; i += size) finalChunks.push(c.slice(i, i + size));
  }
  return finalChunks;
}

async function callGroq(messages){
  if(!AI_API_KEY) return null;
  try {
    const res = await fetch(AI_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${AI_API_KEY}` },
      body: JSON.stringify({ model: AI_MODEL || AI_DEFAULT_MODEL, messages, temperature: 0.5 })
    });
    if(res.ok){ const data = await res.json(); return data?.choices?.[0]?.message?.content?.trim() || null; }
  } catch(e){ console.warn('Groq failed:', e); }
  return null;
}

async function askAI(userMessage){
  const msg = userMessage.toLowerCase().trim();
  const grade = CURRENT_USER?.grade || 'first';
  const kbEntries = Object.values(allKnowledge).filter(k => k.grade === grade);
  const queryWords = msg.split(/\s+/).filter(w => w.length > 2);
  let bestQa = null, bestQaScore = 0;
  for(const entry of kbEntries){
    if(entry.type !== 'qa') continue;
    const keywords = entry.question.toLowerCase().split(' ').filter(Boolean);
    let score = 0;
    for(const kw of keywords){ if(msg.includes(kw) && kw.length > 2) score += kw.length; }
    if(score > bestQaScore){ bestQaScore = score; bestQa = entry; }
  }
  const fileChunks = kbEntries.filter(e => e.type === 'file');
  const scoredChunks = fileChunks.map(chunk => {
    const content = (chunk.content || '').toLowerCase();
    let score = 0;
    for(const w of queryWords){
      const re = new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
      score += (content.match(re) || []).length * w.length;
    }
    return { chunk, score };
  }).filter(x => x.score > 0).sort((a, b) => b.score - a.score);

  if(AI_API_KEY && scoredChunks.length > 0){
    const topChunks = scoredChunks.slice(0, 3).map(x => x.chunk.content).join('\n\n---\n\n');
    const reply = await callGroq([
      { role:'system', content: getSystemPrompt(grade, topChunks) },
      { role:'user', content: userMessage }
    ]);
    if(reply) return reply;
  }
  if(AI_API_KEY){
    const reply = await callGroq([
      { role:'system', content: getSystemPrompt(grade) },
      { role:'user', content: userMessage }
    ]);
    if(reply) return reply;
  }
  let bestDef = null, bestDefScore = 0;
  for(const item of (DEFAULT_KNOWLEDGE[grade] || [])){
    for(const kw of item.keywords){
      if(msg.includes(kw.toLowerCase()) && kw.length > bestDefScore){ bestDefScore = kw.length; bestDef = item; }
    }
  }
  await new Promise(r => setTimeout(r, 300));
  if(bestQa && bestQaScore >= 5) return bestQa.answer;
  if(scoredChunks.length > 0) return scoredChunks[0].chunk.content.slice(0, 800);
  if(bestDef) return bestDef.answer;
  return `معلش مفهمتش قصدك. أنا مساعد مخصص لطلاب ${gradeShort(grade)}.`;
}

onAuthStateChanged(auth, async user => {
  if(user){
    CURRENT_UID = user.uid;
    IS_ADMIN = (user.uid === ADMIN_UID) || (user.email === ADMIN_EMAIL);
    const snap = await get(ref(db, `users/${user.uid}`));
    if(snap.exists()){
      CURRENT_USER = snap.val();
      if(CURRENT_USER.banned && !IS_ADMIN) return renderBanned();
      if(!CURRENT_USER.grade && !IS_ADMIN){ navStack = [{ screen: 'setup' }]; return renderSetup(user); }
      loadData();
      await loadChatSessions();
      navStack = [{ screen: 'home', tab: 'home' }];
      renderHome();
    } else if(IS_ADMIN){
      CURRENT_USER = {uid:user.uid, name:user.displayName || 'المطور', email:user.email, grade:'first', role:'admin'};
      await set(ref(db, `users/${user.uid}`), {...CURRENT_USER, createdAt: Date.now(), banned: false});
      loadData();
      await loadChatSessions();
      navStack = [{ screen: 'home', tab: 'home' }];
      renderHome();
    } else {
      navStack = [{ screen: 'setup' }];
      renderSetup(user);
    }
  } else {
    CURRENT_UID = null; IS_ADMIN = false; CURRENT_USER = null;
    clearListeners();
    allLessons = {}; allExams = {}; allResults = {}; allBooks = {}; allKnowledge = {};
    allCodes = {}; allVideoAccess = {}; allWatchProgress = {};
    chatSessions = []; activeChatId = null; AI_API_KEY = ''; AI_MODEL = AI_DEFAULT_MODEL;
    navStack = [{ screen: 'login' }];
    renderLogin();
  }
});

function loadData(){
  listeners.push(onValue(ref(db, 'lessons'), s => { allLessons = s.val() || {}; if(['lessons','admin'].includes(currentTab)) renderHome(); }));
  listeners.push(onValue(ref(db, 'exams'), s => { allExams = s.val() || {}; if(currentTab==='admin') renderHome(); }));
  listeners.push(onValue(ref(db, 'results'), s => { allResults = s.val() || {}; if(currentTab==='admin') renderHome(); }));
  listeners.push(onValue(ref(db, 'books'), s => { allBooks = s.val() || {}; if(['library','admin'].includes(currentTab)) renderHome(); }));
  listeners.push(onValue(ref(db, 'knowledge'), s => { allKnowledge = s.val() || {}; }));
  listeners.push(onValue(ref(db, 'settings/ai'), s => {
    const v = s.val() || {};
    AI_API_KEY = v.apiKey || '';
    AI_MODEL = v.model || AI_DEFAULT_MODEL;

  listeners.push(onValue(ref(db, 'codes'), s => { allCodes = s.val() || {}; if(currentTab==='admin') renderHome(); }));

}

async function handleCenterLogin(){

    btn.disabled = false; btn.textContent = '🏫 دخول طالب السنتر';
  }
}
/* ========== QR Scanner (مصحح) ========== */
function openQRScanner(){
  // التحقق الأول من دعم المتصفح
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast('الكاميرا مش متاحة. لازم تفتح التطبيق من رابط HTTPS', 'err');
    return;
  }

  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.innerHTML = `<div class="modal-body">
    <h3 style="margin-bottom:16px">📷 مسح QR Code</h3>
    <div id="qr-reader" style="width:100%;border-radius:12px;overflow:hidden;min-height:200px;background:#000"></div>
    <p id="qr-status" style="font-size:12px;color:var(--muted);text-align:center;margin-top:12px">جاري تشغيل الكاميرا...</p>
    <button class="btn btn-ghost" style="margin-top:16px" id="qrCancel">إلغاء</button>
  </div>`;
  document.body.appendChild(modal);

  const statusEl = modal.querySelector('#qr-status');
  const qrScanner = new Html5Qrcode('qr-reader');
  let isStopped = false;

  const stopScanner = () => {
    if(isStopped) return;
    isStopped = true;
    qrScanner.stop().catch(()=>{}).finally(() => {
      try { modal.remove(); } catch(e){}
    });
  };

  qrScanner.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: { width: 250, height: 250 } },
    (text) => {
      stopScanner();
      const parts = text.split('|');
      if(parts.length >= 2){
        document.getElementById('fCode').value = parts[0].toUpperCase();
        document.getElementById('fPhone').value = parts[1];
        handleCenterLogin();
      } else {
        document.getElementById('fCode').value = text.toUpperCase();
        toast('تم قراءة الكود. اكتب رقم هاتفك', 'ok');
      }
    },
    () => {}
  ).then(() => {
    statusEl.textContent = 'وجّه الكاميرا نحو الكود';
  }).catch(err => {
    console.error('Camera error:', err);
    const errStr = String(err);
    let msg = 'فشل تشغيل الكاميرا. ';
    if(errStr.includes('NotAllowedError') || errStr.includes('Permission')){
      msg += 'صلاحية الكاميرا مرفوضة. افتح إعدادات المتصفح واسمح بالكاميرا.';
    } else if(errStr.includes('NotFoundError')){
      msg += 'مفيش كاميرا على الجهاز ده.';
    } else if(errStr.includes('NotReadableError')){
      msg += 'الكاميرا مستخدمة في تطبيق تاني. اقفل التطبيقات التانية وجرب.';
    } else if(errStr.includes('secure context') || errStr.includes('https')){
      msg += 'لازم تفتح التطبيق من رابط HTTPS عشان الكاميرا تشتغل.';
    } else {
      msg += errStr;
    }
    statusEl.textContent = msg;
    statusEl.style.color = 'var(--danger)';
    toast(msg, 'err');
  });

  modal.querySelector('#qrCancel').onclick = stopScanner;
}

/* ========== Lessons + Access Control ========== */
function checkVideoAccess(lessonId){
  const lesson = allLessons[lessonId];
  if(!lesson) return { allowed: false, reason: 'الدرس غير موجود' };
  if(IS_ADMIN) return { allowed: true };
  if(CURRENT_USER?.role === 'center') return { allowed: true };
  if(!lesson.isPaid) return { allowed: true };
  const access = allVideoAccess[`${CURRENT_UID}_${lessonId}`];
  if(access){
    if(access.expiresAt && access.expiresAt < Date.now()){
      return { allowed: false, reason: 'انتهت صلاحية الوصول لهذا الفيديو', needCode: true };
    }
    return { allowed: true };
  }
  return { allowed: false, reason: 'هذا الفيديو مدفوع. ادخل الكود للوصول', needCode: true };
}

function isLessonUnlocked(idx, lessons){
  if(IS_ADMIN) return true;
  const lesson = lessons[idx];
  if(!lesson) return false;
  if(idx === 0) return true;
  const prev = lessons[idx-1];
  if(!prev) return true;
  const prevHasExam = Object.values(allExams).some(e => e.lessonId === prev.id);
  if(!prevHasExam) return true;
  const myResults = Object.values(allResults).filter(r => r.studentId === CURRENT_UID && r.lessonId === prev.id);
  const passedPrev = myResults.some(r => r.passed);
  if(passedPrev) return true;
  const watch = allWatchProgress[prev.id];
  if(watch && watch.percent >= 90) return true;
  return false;
}

function renderLessonsTab(){
  const page = document.getElementById('mainPage');
  if(!page) return;
  const grade = CURRENT_USER?.grade;
  const lessons = Object.values(allLessons)
    .filter(l => l.grade === grade)
    .sort((a,b) => String(a.order||'').localeCompare(String(b.order||''), 'ar'));
  const myResults = Object.values(allResults).filter(r => r.studentId === CURRENT_UID);
  const passedLessonIds = new Set(myResults.filter(r => r.passed).map(r => r.lessonId));

  page.innerHTML = `
    <div class="section-title">دروس ${esc(gradeLabel(grade))}</div>
    ${lessons.length === 0 ? `<div class="empty"><div class="big">🎥</div><div class="title">لا توجد دروس بعد</div></div>`
      : lessons.map((lesson, idx) => {
        const unlocked = isLessonUnlocked(idx, lessons);
        const access = checkVideoAccess(lesson.id);
        const canWatch = unlocked && access.allowed;
        const hasExam = Object.values(allExams).some(e => e.lessonId === lesson.id);
        const passedThis = passedLessonIds.has(lesson.id);
        const watchProgress = allWatchProgress[lesson.id]?.percent || 0;
        const isPaid = lesson.isPaid;
        return `
          <div class="lesson-card">
            <div class="lesson-video">
              ${canWatch
                ? `<div class="play-overlay" data-play="${lesson.id}">🎬</div>`
                : !unlocked
                  ? `<div class="locked-overlay">🔒<div class="lbl">اكمل الدرس السابق</div></div>`
                  : `<div class="locked-overlay">💰<div class="lbl">ادخل الكود للوصول</div></div>`}
            </div>
            <div class="lesson-info">
              <h4>${esc(lesson.title)} ${isPaid ? '💰' : ''}</h4>
              <p style="font-size:11px;color:var(--primary-dark);font-weight:700;margin-bottom:6px">📌 ${esc(lesson.order || '')}</p>
              <p>${esc(lesson.description || '')}</p>
              ${watchProgress > 0 && watchProgress < 100 ? `<div style="font-size:11px;color:var(--warning);margin-bottom:6px">📺 شاهدت ${watchProgress}%</div>` : ''}
              <div style="display:flex;gap:8px;flex-wrap:wrap">
                ${canWatch
                  ? `<button class="btn btn-sm" style="flex:1" data-play="${lesson.id}">▶️ مشاهدة</button>`
                  : !unlocked
                    ? `<button class="btn btn-sm btn-ghost" disabled style="flex:1">🔒 مقفول</button>`
                    : `<button class="btn btn-sm" style="flex:1" data-code="${lesson.id}">💰 ادخل الكود</button>`}
                ${hasExam && canWatch ? `<button class="btn btn-sm ${passedThis?'btn-success':'btn-primary'}" style="flex:1" data-exam="${lesson.id}">${passedThis?'✅ الامتحان':'📝 امتحن'}</button>` : ''}
              </div>
            </div>
          </div>`;
      }).join('')}`;

  page.querySelectorAll('[data-play]').forEach(el => {
    el.onclick = () => { pushNav({ screen: 'lesson', lessonId: el.dataset.play }); playLesson(el.dataset.play); };
  });
  page.querySelectorAll('[data-exam]').forEach(el => {
    el.onclick = () => { pushNav({ screen: 'exam', lessonId: el.dataset.exam }); openExam(el.dataset.exam); };
  });
  page.querySelectorAll('[data-code]').forEach(el => {
    el.onclick = () => openVideoAccessModal(el.dataset.code);
  });
}

/* ========== Video Access Modal ========== */
function openVideoAccessModal(lessonId){
  const lesson = allLessons[lessonId];
  if(!lesson) return;
  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.innerHTML = `<div class="modal-body">
    <h3 style="margin-bottom:16px">💰 فيديو مدفوع</h3>
    <p style="font-size:13px;color:var(--muted);margin-bottom:16px">${esc(lesson.title)}<br>ادخل الكود اللي اشتريته من المدرس</p>
    <div class="field"><label>الكود</label><input id="accessCode" placeholder="مثال: V1D2A3" style="text-align:center;font-size:18px;letter-spacing:3px;font-weight:800;text-transform:uppercase"></div>
    <div class="err" id="codeErr"></div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn btn-ghost" id="codeCancel">إلغاء</button>
      <button class="btn btn-success" id="codeSubmit">✅ تفعيل</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
  modal.querySelector('#codeCancel').onclick = () => modal.remove();
  modal.querySelector('#codeSubmit').onclick = async () => {
    const code = modal.querySelector('#accessCode').value.trim().toUpperCase();
    if(!code){ modal.querySelector('#codeErr').textContent = 'اكتب الكود'; return; }
    const btn = modal.querySelector('#codeSubmit'); btn.disabled = true; btn.textContent = '...';
    try {
      const snap = await get(ref(db, `videoCodes/${code}`));
      if(!snap.exists()){
        modal.querySelector('#codeErr').textContent = 'كود غير صحيح';
        btn.disabled = false; btn.textContent = '✅ تفعيل';
        return;
      }
      const codeData = snap.val();
      if(codeData.lessonId !== lessonId){
        modal.querySelector('#codeErr').textContent = 'الكود لا يخص هذا الفيديو';
        btn.disabled = false; btn.textContent = '✅ تفعيل';
        return;
      }
      if(codeData.expiresAt && codeData.expiresAt < Date.now()){
        modal.querySelector('#codeErr').textContent = 'انتهت صلاحية الكود';
        btn.disabled = false; btn.textContent = '✅ تفعيل';
        return;
      }
      const usedDevices = codeData.usedDevices || [];
      if(!usedDevices.includes(CURRENT_UID)){
        if(usedDevices.length >= (codeData.maxDevices || 1)){
          modal.querySelector('#codeErr').textContent = 'تم استخدام الكود على الحد الأقصى من الأجهزة';
          btn.disabled = false; btn.textContent = '✅ تفعيل';
          return;
        }
        await update(ref(db, `videoCodes/${code}`), { usedDevices: [...usedDevices, CURRENT_UID] });
      }
      await set(ref(db, `videoAccess/${CURRENT_UID}_${lessonId}`), {
        lessonId, code, grantedAt: Date.now(), expiresAt: codeData.expiresAt || null
      });
      toast('تم تفعيل الوصول ✅', 'ok');
      modal.remove();
      renderLessonsTab();
    } catch(e){
      modal.querySelector('#codeErr').textContent = 'خطأ: ' + e.message;
      btn.disabled = false; btn.textContent = '✅ تفعيل';
    }
  };
}

function playLesson(lessonId){
  const lesson = allLessons[lessonId];
  if(!lesson) return;
  if(!checkVideoAccess(lessonId).allowed){ toast('غير مسموح', 'err'); return; }

  const yt = lesson.videoUrl.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]+)/);
  const ytId = yt ? yt[1] : null;

  $app.innerHTML = `
    <div class="topbar"><button class="icon-btn" id="back">←</button><h1>${esc(lesson.title)}</h1></div>
    <div class="page">
      <div style="position:relative;aspect-ratio:16/9;background:#000;margin:16px;border-radius:14px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,0.4)">
        ${ytId
          ? `<iframe id="ytFrame" src="https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0&modestbranding=1&playsinline=1&enablejsapi=1"
               allowfullscreen allow="autoplay; encrypted-media"
               style="width:100%;height:100%;border:none;display:block"></iframe>`
          : `<video id="directVideo" src="${esc(lesson.videoUrl)}" controls autoplay playsinline style="width:100%;height:100%;display:block;background:#000"></video>`}
      </div>
      <div style="padding:16px">
        <h2 style="font-size:18px;font-weight:800;margin-bottom:8px">${esc(lesson.title)}</h2>
        <p style="color:var(--primary-dark);font-size:12px;font-weight:700;margin-bottom:8px">📌 ${esc(lesson.order || '')}</p>
        <p style="color:var(--muted);font-size:14px;line-height:1.7;white-space:pre-wrap">${esc(lesson.description || '')}</p>
        ${Object.values(allExams).some(e => e.lessonId === lesson.id)
          ? `<button class="btn btn-primary" id="examBtn" style="margin-top:20px">📝 حل الامتحان</button>` : ''}
      </div>
    </div>`;

  document.getElementById('back').onclick = () => { stopVideoTimer(); goBack(); };
  document.getElementById('examBtn')?.addEventListener('click', () => {
    pushNav({ screen: 'exam', lessonId: lesson.id }); openExam(lesson.id);
  });

  startWatchTracking(lessonId, lesson.durationMinutes || 5);
}

function startWatchTracking(lessonId, durationMin){
  stopVideoTimer();
  const totalSec = durationMin * 60;
  currentVideoStartTime = Date.now();
  currentVideoTimer = setInterval(async () => {
    if(!CURRENT_UID) return;
    const elapsed = Math.floor((Date.now() - currentVideoStartTime) / 1000);
    const percent = Math.min(100, Math.round((elapsed / totalSec) * 100));
    try {
      await set(ref(db, `watchProgress/${CURRENT_UID}/${lessonId}`), {
        percent, elapsed, totalSec, updatedAt: Date.now()
      });
    } catch(e){}
  }, 10000);
  setTimeout(() => { stopVideoTimer(); }, totalSec * 1000 + 5000);
}

function stopVideoTimer(){
  if(currentVideoTimer){ clearInterval(currentVideoTimer); currentVideoTimer = null; }
}

/* ========== Exam Engine (Dynamic) ========== */
function openExam(lessonId){
  const examList = Object.values(allExams).filter(e => e.lessonId === lessonId);
  if(examList.length === 0){ toast('لا يوجد امتحان', 'err'); return; }
  let currentQuestion = 0;
  const answers = {};
  const shuffled = [...examList].sort(() => Math.random() - 0.5);

  const drawExam = () => {
    const q = shuffled[currentQuestion];
    let optionsHTML = '';
    if(q.type === 'mcq'){
      optionsHTML = q.options.map((opt, i) => `
        <div class="exam-option ${answers[currentQuestion]===i?'selected':''}" data-opt="${i}">
          <div class="letter">${String.fromCharCode(65+i)}</div>
          <div class="txt">${esc(opt)}</div>
        </div>`).join('');
    } else if(q.type === 'truefalse'){
      optionsHTML = ['صح','غلط'].map((opt, i) => `
        <div class="exam-option ${answers[currentQuestion]===i?'selected':''}" data-opt="${i}">
          <div class="letter">${i===0?'✓':'✗'}</div>
          <div class="txt">${opt}</div>
        </div>`).join('');
    }

    $app.innerHTML = `
      <div class="topbar"><button class="icon-btn" id="back">←</button><h1>📝 امتحان</h1><span style="font-size:12px;color:var(--muted)">${currentQuestion+1}/${shuffled.length}</span></div>
      <div class="page" style="padding:16px">
        <div style="background:#fff;padding:20px;border-radius:14px;border:1px solid var(--border);margin-bottom:16px">
          <div style="font-size:13px;color:var(--primary-dark);font-weight:700;margin-bottom:8px">
            ${q.type==='mcq'?'اختيار من متعدد':'صح وغلط'}
          </div>
          <div style="font-size:16px;font-weight:700;line-height:1.6">${esc(q.question)}</div>
        </div>
        <div>${optionsHTML}</div>
        <div style="margin-top:20px;display:flex;gap:10px">
          ${currentQuestion > 0 ? `<button class="btn btn-ghost" id="prevBtn" style="flex:1">⬅️ السابق</button>` : ''}
          ${currentQuestion < shuffled.length-1
            ? `<button class="btn" id="nextBtn" style="flex:1">التالي ➡️</button>`
            : `<button class="btn btn-success" id="finishBtn" style="flex:1">🏁 إنهاء</button>`}
        </div>
      </div>`;
    document.getElementById('back').onclick = goBack;
    document.querySelectorAll('.exam-option').forEach(el => {
      el.onclick = () => { answers[currentQuestion] = parseInt(el.dataset.opt); drawExam(); };
    });
    document.getElementById('prevBtn')?.addEventListener('click', () => { currentQuestion--; drawExam(); });
    document.getElementById('nextBtn')?.addEventListener('click', () => { currentQuestion++; drawExam(); });
    document.getElementById('finishBtn')?.addEventListener('click', () => submitExam());
  };

  const submitExam = async () => {
    let correct = 0;
    shuffled.forEach((q, i) => { if(answers[i] === q.correct) correct++; });
    const total = shuffled.length;
    const percent = Math.round((correct/total) * 100);
    const passed = percent >= 50;
    try {
      await push(ref(db, 'results'), {
        studentId: CURRENT_UID, studentName: CURRENT_USER.name, studentGrade: CURRENT_USER.grade,
        lessonId, lessonTitle: allLessons[lessonId]?.title || '',
        correct, total, percent, passed, createdAt: Date.now()
      });
    } catch(e){ console.error(e); }
    $app.innerHTML = `
      <div class="topbar"><button class="icon-btn" id="back">←</button><h1>🏁 نتيجة</h1></div>
      <div class="page" style="padding:24px;text-align:center">
        <div style="font-size:80px;margin-bottom:16px">${passed?'🎉':'😔'}</div>
        <h2 style="font-size:24px;font-weight:900;margin-bottom:8px;color:${passed?'var(--success)':'var(--danger)'}">${passed?'مبروك نجحت!':'للأسف رسبت'}</h2>
        <p style="color:var(--muted);margin-bottom:20px">درجتك: <b>${correct}/${total}</b> (${percent}%)</p>
        <button class="btn" id="backBtn">العودة للدروس</button>
      </div>`;
    document.getElementById('back').onclick = goBack;
    document.getElementById('backBtn').onclick = () => { navStack = [{ screen: 'home', tab: 'lessons' }]; currentTab = 'lessons'; renderHome(); };
  };
  drawExam();
}

/* ========== Chat ========== */
function renderChatTab(){
  const page = document.getElementById('mainPage');
  if(!page) return;
  const active = chatSessions.find(s => s.id === activeChatId) || null;
  const messages = active?.messages || [];
  page.innerHTML = `
    <div class="chat-container">
      <div style="display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border);background:#fff">
        <button class="btn btn-sm" id="newChatBtn" style="flex:1">➕ محادثة جديدة</button>
        <button class="btn btn-sm btn-ghost" id="listChatsBtn" style="flex:1">📂 المحادثات (${chatSessions.length})</button>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-wrap">
        <textarea class="chat-input" id="chatInput" rows="1" placeholder="اكتب سؤالك هنا..."></textarea>
        <button class="chat-send" id="chatSend">➤</button>
      </div>
    </div>`;
  const msgs = document.getElementById('chatMessages');
  const inp = document.getElementById('chatInput');
  const sendBtn = document.getElementById('chatSend');
  const renderMsgs = () => {
    msgs.innerHTML = messages.length === 0
      ? `<div class="msg ai">أهلاً! أنا مساعدك الدراسي. اسألني أي حاجة.</div>`
      : messages.map(m => `<div class="msg ${m.role === 'user' ? 'user' : 'ai'}">${esc(m.content)}</div>`).join('');
    msgs.scrollTop = msgs.scrollHeight;
  };
  renderMsgs();
  document.getElementById('newChatBtn').onclick = () => {
    const id = 'c_' + Date.now();
    chatSessions.unshift({ id, title: 'محادثة ' + new Date().toLocaleString('ar-EG'), messages: [], createdAt: Date.now() });
    activeChatId = id; saveChatSession(chatSessions[0]); renderChatTab();
  };
  document.getElementById('listChatsBtn').onclick = () => {
    if(chatSessions.length === 0){ toast('لا توجد محادثات', 'err'); return; }
    const modal = document.createElement('div');
    modal.className = 'modal-bg';
    modal.innerHTML = `<div class="modal-body">
      <h3 style="margin-bottom:16px">📂 المحادثات</h3>
      ${chatSessions.map(s => `
        <div class="list-item" style="margin:0 0 8px">
          <div class="ic">💬</div>
          <div class="info" data-open="${s.id}" style="cursor:pointer">
            <div class="title">${esc(s.title)}</div>
            <div class="meta">${s.messages.length} رسالة</div>
          </div>
          <button class="btn btn-sm btn-danger" data-delchat="${s.id}">🗑️</button>
        </div>`).join('')}
      <button class="btn btn-ghost" style="margin-top:16px" id="closeModal">إغلاق</button>
    </div>`;
    document.body.appendChild(modal);
    modal.querySelector('#closeModal').onclick = () => modal.remove();
    modal.querySelectorAll('[data-open]').forEach(el => {
      el.onclick = () => { activeChatId = el.dataset.open; modal.remove(); renderChatTab(); };
    });
    modal.querySelectorAll('[data-delchat]').forEach(b => {
      b.onclick = async (e) => {
        e.stopPropagation();
        if(!confirm('حذف؟')) return;
        await deleteChatSession(b.dataset.delchat);
        chatSessions = chatSessions.filter(s => s.id !== b.dataset.delchat);
        if(activeChatId === b.dataset.delchat) activeChatId = chatSessions[0]?.id || null;
        modal.remove(); renderChatTab();
      };
    });
  };
  const send = async () => {
    const text = inp.value.trim(); if(!text) return;
    if(!activeChatId){
      const id = 'c_' + Date.now();
      chatSessions.unshift({ id, title: text.slice(0,30), messages: [], createdAt: Date.now() });
      activeChatId = id;
    }
    inp.value = ''; inp.style.height = 'auto';
    const active = chatSessions.find(s => s.id === activeChatId);
    active.messages.push({ role:'user', content: text });
    if(active.messages.length === 1) active.title = text.slice(0,30);
    renderMsgs(); saveChatSession(active);
    sendBtn.disabled = true;
    try {
      const reply = await askAI(text);
      active.messages.push({ role:'assistant', content: reply });
      renderMsgs(); saveChatSession(active);
    } catch(e){
      active.messages.push({ role:'assistant', content: '❌ خطأ' });
      renderMsgs(); saveChatSession(active);
    }
    sendBtn.disabled = false;
  };
  sendBtn.onclick = send;
  inp.onkeydown = (e) => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); } };
}

function showCodeWithQR(code, phone, name){
  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.innerHTML = `<div class="modal-body">
    <h3 style="margin-bottom:16px">✅ تم التوليد</h3>

    <p style="font-size:11px;color:var(--muted);text-align:center">الكود والـ QR صالحان للدخول</p>
    <button class="btn btn-ghost" style="margin-top:16px" id="closeModal">إغلاق</button>
  </div>`;
  document.body.appendChild(modal);
  const qrText = `${code}|${phone}`;
  QRCode.toCanvas(qrText, { width: 220, margin: 1 }, (err, canvas) => {

  });
  modal.querySelector('#closeModal').onclick = () => modal.remove();

function openAddExamModal(gradeId){
  const lessons = Object.values(allLessons).filter(l => l.grade === gradeId);
  if(lessons.length === 0){ toast('أضف درس أولاً', 'err'); return; }
  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.innerHTML = `<div class="modal-body">
    <h3 style="margin-bottom:16px">➕ إضافة سؤال</h3>
    <div class="field"><label>الدرس</label><select id="eLesson">${lessons.map(l => `<option value="${l.id}">${esc(l.title)}</option>`).join('')}</select></div>
    <div class="field"><label>النوع</label><select id="eType"><option value="mcq">اختيار</option><option value="truefalse">صح/غلط</option></select></div>
    <div class="field"><label>السؤال</label><textarea id="eQ" rows="2"></textarea></div>
    <div id="mcqF">
      <div class="field"><label>خيار 1</label><input id="o1"></div>
      <div class="field"><label>خيار 2</label><input id="o2"></div>
      <div class="field"><label>خيار 3</label><input id="o3"></div>
      <div class="field"><label>خيار 4</label><input id="o4"></div>
      <div class="field"><label>الصحيح (1-4)</label><input id="cor" type="number" min="1" max="4" value="1"></div>
    </div>
    <div id="tfF" class="hidden">
      <div class="field"><label>الصحيح</label><select id="tfCor"><option value="0">صح</option><option value="1">غلط</option></select></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn btn-ghost" id="cCancel">إلغاء</button>
      <button class="btn" id="cSave">حفظ</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
  modal.querySelector('#eType').onchange = (e) => {
    const t = e.target.value;
    modal.querySelector('#mcqF').classList.toggle('hidden', t !== 'mcq');
    modal.querySelector('#tfF').classList.toggle('hidden', t !== 'truefalse');
  };
  modal.querySelector('#cCancel').onclick = () => modal.remove();
  modal.querySelector('#cSave').onclick = async () => {
    const lessonId = modal.querySelector('#eLesson').value;
    const type = modal.querySelector('#eType').value;
    const question = modal.querySelector('#eQ').value.trim();
    if(!question){ toast('اكتب السؤال', 'err'); return; }
    const data = { id: push(ref(db, 'exams')).key, lessonId, type, question, createdAt: Date.now() };
    if(type === 'mcq'){
      data.options = [1,2,3,4].map(i => modal.querySelector(`#o${i}`).value.trim());
      data.correct = parseInt(modal.querySelector('#cor').value) - 1;
      if(data.options.some(o => !o)){ toast('املأ الخيارات', 'err'); return; }
    } else {
      data.correct = parseInt(modal.querySelector('#tfCor').value);
    }
    await set(ref(db, `exams/${data.id}`), data);
    toast('تمت الإضافة', 'ok'); modal.remove();
  };
}

/* ========== Train AI ========== */
function renderTrainAI(){
  if(!IS_ADMIN){ toast('ممنوع', 'err'); return renderHome(); }
  const kbEntries = Object.entries(allKnowledge).filter(([id, k]) => k.grade === adminKbGradeFilter);
  $app.innerHTML = `
    <div class="topbar"><button class="icon-btn" id="back">←</button><h1>🧠 تدريب المساعد</h1></div>
    <div class="page" style="padding:16px">
      <div class="admin-grade-tabs" style="padding:0 0 16px">
        ${GRADES.map(g => `<div class="admin-grade-tab ${adminKbGradeFilter === g.id ? 'active' : ''}" data-kb-grade="${g.id}">${g.short}</div>`).join('')}
      </div>
      <div style="background:#fff;padding:16px;border-radius:14px;border:1px solid var(--border);margin-bottom:16px">
        <h3 style="font-size:15px;font-weight:800;margin-bottom:8px">📤 رفع ملف TXT</h3>
        <input type="file" id="kbFile" accept=".txt" style="width:100%;padding:10px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;font-size:13px">
        <div id="kbFileInfo" style="font-size:12px;color:var(--primary-dark);margin-bottom:10px;display:none"></div>
        <div class="field"><label>أو الصق المحتوى</label><textarea id="kbText" rows="4"></textarea></div>
        <div class="field"><label>العنوان</label><input id="kbTitle"></div>
        <button class="btn" id="uploadKbBtn">💾 حفظ وتحليل</button>
      </div>
      <div class="section-title" style="padding:0 0 10px">🧠 المعرفة (${kbEntries.length})</div>
      ${kbEntries.map(([id, e]) => `
        <div class="kb-item">
          <div class="kb-q">${e.type === 'qa' ? '❓ ' + esc(e.question) : '📄 ' + esc(e.title || '')}</div>
          <div class="kb-a">${esc((e.type === 'qa' ? e.answer : e.content || '').slice(0, 150))}...</div>
          <button class="kb-del" data-del="${id}">🗑️</button>
        </div>`).join('')}
    </div>`;
  document.getElementById('back').onclick = goBack;
  document.querySelectorAll('[data-kb-grade]').forEach(t => {
    t.onclick = () => { adminKbGradeFilter = t.dataset.kbGrade; renderTrainAI(); };
  });
  document.getElementById('kbFile').onchange = async (e) => {
    const file = e.target.files[0]; const info = document.getElementById('kbFileInfo');
    if(!file){ info.style.display = 'none'; return; }
    if(!file.name.toLowerCase().endsWith('.txt')){ toast('لازم .txt', 'err'); e.target.value = ''; return; }
    const text = await file.text();
    info.style.display = 'block';
    info.textContent = `📄 ${file.name} — ${(text.length/1000).toFixed(1)} ألف حرف`;
  };
  document.getElementById('uploadKbBtn').onclick = async () => {
    const file = document.getElementById('kbFile').files[0];
    const pasted = document.getElementById('kbText').value.trim();
    const title = document.getElementById('kbTitle').value.trim() || 'منهج';
    const content = file ? await file.text() : pasted;
    if(!content){ toast('ارفع أو الصق', 'err'); return; }
    const btn = document.getElementById('uploadKbBtn'); btn.disabled = true;
    try {
      const chunks = splitIntoChunks(content, 3000);
      for(let i = 0; i < chunks.length; i++){
        const id = push(ref(db, 'knowledge')).key;
        await set(ref(db, `knowledge/${id}`), {
          type: 'file', grade: adminKbGradeFilter, title: `${title} (${i+1}/${chunks.length})`,
          sourceTitle: title, content: chunks[i], createdAt: Date.now()
        });
      }
      toast(`تم رفع ${chunks.length} جزء`, 'ok');
      document.getElementById('kbFile').value = ''; document.getElementById('kbText').value = ''; document.getElementById('kbTitle').value = '';
      document.getElementById('kbFileInfo').style.display = 'none';
    } catch(e){ toast('فشل', 'err'); }
    btn.disabled = false;
  };
  document.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = async () => { if(!confirm('حذف؟')) return; await remove(ref(db, `knowledge/${b.dataset.del}`)); toast('تم', 'ok'); };
  });
}
